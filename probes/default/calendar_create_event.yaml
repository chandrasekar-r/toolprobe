name: calendar_create_event
description: Multi-arg calendar create (title, start, end, timezone).
user: Create a calendar event titled "Standup" starting 2026-10-02T09:00:00+02:00 ending 2026-10-02T09:30:00+02:00 in Europe/Berlin.
tools:
  - name: create_event
    description: Create a calendar event
    parameters:
