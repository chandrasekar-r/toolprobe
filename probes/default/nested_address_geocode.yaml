name: nested_address_geocode
description: Nested object args — address.street/city/postal_code.
user: Geocode 10 Downing Street, London, SW1A 2AA.
tools:
  - name: geocode
    description: Geocode a postal address
    parameters:
      type: object
      properties:
        address:
          type: object
          properties:
            street: { type: string }
            city: { type: string }
            postal_code: { type: string }
          required: [street, city, postal_code]
          additionalProperties: false
      required: [address]
      additionalProperties: false
expect:
  tool_name: geocode
  args:
    address:
      street: "10 Downing Street"
      city: London
      postal_code: SW1A 2AA
mock:
  mode: tool_calls
  tool_name: geocode
  args:
    address:
      street: "10 Downing Street"
      city: London
      postal_code: SW1A 2AA
