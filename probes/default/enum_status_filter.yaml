name: enum_status_filter
description: Enum arg — status must be one of open|closed|all.
user: List issues with status closed.
tools:
  - name: list_issues
    description: List issues filtered by status
    parameters:
      type: object
      properties:
        status:
          type: string
          enum: [open, closed, all]
